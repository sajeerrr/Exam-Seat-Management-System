<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExamSeat{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary:     #f0f4ff;
            --bg-secondary:   #e8eeff;
            --bg-card:        rgba(255,255,255,0.75);
            --bg-card-hover:  rgba(255,255,255,0.95);
            --border:         rgba(99,102,241,0.15);
            --border-hover:   rgba(99,102,241,0.5);
            --accent:         #4f46e5;
            --accent-light:   #6366f1;
            --accent-glow:    rgba(99,102,241,0.15);
            --text-primary:   #1e1b4b;
            --text-secondary: #475569;
            --text-muted:     #94a3b8;
            --success:        #059669;
            --success-bg:     rgba(5,150,105,0.1);
            --success-border: rgba(5,150,105,0.25);
            --warning:        #d97706;
            --warning-bg:     rgba(217,119,6,0.1);
            --error:          #dc2626;
            --error-bg:       rgba(220,38,38,0.08);
            --error-border:   rgba(220,38,38,0.2);
            --end-seat:       rgba(5,150,105,0.12);
            --mid-seat:       rgba(99,102,241,0.03);
            --shadow-card:    rgba(99,102,241,0.1);
            --blob-a:         rgba(99,102,241,0.08);
            --blob-b:         rgba(16,185,129,0.05);
            --bg-sunken:      rgba(99,102,241,0.05);
            --bg-nav-bar:     rgba(99,102,241,0.07);
            --bg-interactive: rgba(99,102,241,0.07);
            --bg-interactive-hover: rgba(99,102,241,0.14);
            --radius:         14px;
            --radius-sm:      8px;
        }

        /* ══ GLOBAL RESET ═══════════════════════════════════════════ */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Inter', sans-serif; }

    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>


{% block content %}{% endblock %}



</body>
</html>
